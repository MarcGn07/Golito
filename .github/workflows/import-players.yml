name: Import players

# Manually triggered from the "Actions" tab on GitHub — runs entirely
# on GitHub's own servers, not on your computer. Re-run any time you
# want to refresh the players table from a newer copy of the dataset.
on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download players dataset
        run: |
          mkdir -p data
          curl -L -o data/players.csv.gz https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/players.csv.gz
          gunzip data/players.csv.gz

      - name: Run import
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run import:players
